<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deploy — BFBotForge Cyp</title><link rel="stylesheet" href="css/style.css"></head><body><header class="topbar"><a class="brand" href="index.html"><span class="logo">BF</span><span>BFBotForge <b>Cyp</b></span></a><div class="actions"><button class="theme-toggle" data-theme>☾</button><a class="btn ghost" href="dashboard.html">Dashboard</a></div></header><main class="form-page"><div class="form-card"><span class="eyebrow">DEPLOY BOT</span><h1 id="botTitle">Deploy a bot</h1><p id="botDesc" class="muted">Select an available bot from the marketplace to continue.</p><form id="deployForm"><label>Session ID / Session Link<input id="session" required placeholder="Paste your session ID or link"></label><label>Package<select id="package"><option value="50-20">KSh 50 — 20 days</option><option value="100-30">KSh 100 — 30 days</option><option value="100-57">KSh 100 — 57 days</option></select></label><button class="btn full">Continue to payment</button></form><div class="notice">Never paste passwords or private keys here. A real deployment endpoint must be securely configured before credentials are transmitted.</div></div></main><script src="js/config.js"></script><script src="js/app.js"></script><script>document.getElementById('deployForm')?.addEventListener('submit',e=>{e.preventDefault();const u=JSON.parse(localStorage.getItem('bf_user')||'null');if(!u){location.href='login.html';return}localStorage.setItem('bf_pending_deploy',JSON.stringify({bot:new URLSearchParams(location.search).get('bot')||'bot',package:document.getElementById('package').value,created:new Date().toLocaleString()}));location.href='payment.html'});</script></body></html>
