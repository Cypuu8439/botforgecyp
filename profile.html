<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>Profile & Settings — BFBotForge Cyp</title><link rel="stylesheet" href="css/style.css"><script src="js/guard.js"></script></head><body><header class="topbar"><a class="brand" href="dashboard.html"><span class="logo">BF</span><span>BFBotForge <b>Cyp</b></span></a><div class="actions"><button class="theme-toggle" data-theme>☾</button><a class="btn ghost" href="dashboard.html">Dashboard</a></div></header><main class="form-page"><div class="form-card"><span class="eyebrow">ACCOUNT SETTINGS</span><h1>Profile</h1><div class="grid"><div class="card"><span class="eyebrow">USERNAME</span><h3 id="pUsername">—</h3></div><div class="card"><span class="eyebrow">EMAIL</span><h3 id="pEmail">—</h3></div></div><label>Full name<input id="pName" autocomplete="name"></label><label>Phone<input id="pPhone" autocomplete="tel"></label><button class="btn full" id="saveProfile">Save profile</button><div class="notice"><strong>Security</strong><br>Password changes are intentionally not stored in the browser. A production backend must verify the current password, hash the new password and invalidate old sessions.</div><h2>Change password</h2><label>Current password<input id="currentPassword" type="password" autocomplete="current-password"></label><label>New password<input id="newPassword" type="password" minlength="8" autocomplete="new-password"></label><label>Confirm new password<input id="confirmNewPassword" type="password" minlength="8" autocomplete="new-password"></label><button class="btn ghost full" id="changePassword">Request secure password change</button><h2>Danger zone</h2><button class="btn danger full" id="deleteAccount">Delete demo account & local data</button></div></main><div id="toast"></div><script src="js/profile.js"></script></body></html>
